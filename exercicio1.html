<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 1 — Cadastro de Academia</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-4">Cadastro de Academia</h1>
      <form id="formAcademia" class="card p-4 shadow-sm">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input
            type="text"
            id="nome"
            class="form-control"
            maxlength="40"
            placeholder="Digite seu nome"
          />
        </div>
        <div class="mb-3">
          <label for="idade" class="form-label">Idade</label>
          <input
            type="number"
            id="idade"
            class="form-control"
            required
            min="14"
            max="100"
          />
        </div>
        <div class="mb-3">
          <label for="plano" class="form-label">Plano</label>
          <select id="plano" class="form-select">
            <option value="100">Musculação (R$ 100,00)</option>
            <option value="130">Funcional (R$ 130,00)</option>
            <option value="180">Completo (R$ 180,00)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Período</label>
          <div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="periodo"
                id="manha"
                value="manha"
                checked
              />
              <label class="form-check-label" for="manha">Manhã</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="periodo"
                id="tarde"
                value="tarde"
              />
              <label class="form-check-label" for="tarde">Tarde</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="periodo"
                id="noite"
                value="noite"
              />
              <label class="form-check-label" for="noite">Noite</label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Adicionais</label>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="personal"
              value="80"
            />
            <label class="form-check-label" for="personal"
              >Personal Trainer (R$ 80,00)</label
            >
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="avaliacao"
              value="50"
            />
            <label class="form-check-label" for="avaliacao"
              >Avaliação Física (R$ 50,00)</label
            >
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="button" id="btnCalcular" class="btn btn-primary">
            Calcular Mensalidade
          </button>
          <button type="button" id="btnLimpar" class="btn btn-secondary">
            Limpar
          </button>
        </div>
      </form>

      <h2 class="mt-5">Tabela de Preços</h2>
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Serviço</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Musculação</td>
            <td>R$ 100,00</td>
          </tr>
          <tr>
            <td>Funcional</td>
            <td>R$ 130,00</td>
          </tr>
          <tr>
            <td>Completo</td>
            <td>R$ 180,00</td>
          </tr>
          <tr>
            <td>Personal Trainer</td>
            <td>R$ 80,00</td>
          </tr>
          <tr>
            <td>Avaliação Física</td>
            <td>R$ 50,00</td>
          </tr>
          <tr>
            <td>Desconto 60+ anos</td>
            <td>10%</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      const btnCalcular = document.getElementById("btnCalcular");
      const btnLimpar = document.getElementById("btnLimpar");

      btnCalcular.addEventListener("click", () => {
        const idadeInput = document.getElementById("idade");
        if (!idadeInput.checkValidity()) {
          idadeInput.reportValidity();
          return;
        }
        const plano = parseFloat(document.getElementById("plano").value);
        let total = plano;
        if (document.getElementById("personal").checked) total += 80;
        if (document.getElementById("avaliacao").checked) total += 50;
        const idade = parseInt(document.getElementById("idade").value, 10);
        if (idade >= 60) total *= 0.9;
        alert("Valor final da mensalidade: R$ " + total.toFixed(2));
      });

      btnLimpar.addEventListener("click", () => {
        document.getElementById("formAcademia").reset();
        document.getElementById("nome").value = "";
        document.getElementById("idade").value = "";
        document.getElementById("plano").selectedIndex = 0;
        document.getElementById("manha").checked = true;
        document.getElementById("personal").checked = false;
        document.getElementById("avaliacao").checked = false;
      });
    </script>
  </body>
</html>
